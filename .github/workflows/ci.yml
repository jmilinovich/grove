name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_schema_change:
        description: "Confirm deploy may apply better-sqlite3 schema migrations (src/db-migration*.ts or src/db.ts changed)"
        type: boolean
        default: false

# Cancel stale runs on the same ref — saves minutes on rapid-fire pushes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run check:invariants
      - run: npm test

  plan-drift:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      - run: npm run check:plan

  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - name: npm audit (high + critical only)
        run: npm audit --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Smoke test for the deploy script's PM2 verbs against the prod-pinned
  # PM2 version. Catches "the verb threw on the prod binary" bugs that
  # vitest, tsc, audit, and gitleaks all cannot — i.e. PR #110 (`pm2
  # startOrReload` reads `config.deploy` without null-check) and PR #111
  # (`pm2 reload <freeform-name>.cjs` parses the path as a process name).
  # The job mirrors the exact two-step verb sequence the deploy script
  # runs and uses the same filename pattern prod expects.
  #
  # If prod's PM2 is upgraded, bump `pm2@<version>` here. The deploy
  # script also echoes `pm2 -v` per deploy so version drift surfaces.
  pm2-deploy-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm
      - run: npm ci
      # Pin to prod PM2 (verified via `pm2 -v` on the prod box). When
      # prod bumps, bump here too — otherwise this test drifts away
      # from reality and provides false confidence.
      - run: npm i -g pm2@6.0.14
      - name: Exercise the deploy script's pm2 verb sequence
        run: |
          set -euxo pipefail
          mkdir -p /tmp/smoke && cd /tmp/smoke
          cat > app.js <<'JS'
          const http = require('http');
          http.createServer((_, res) => res.end('ok')).listen(0);
          setInterval(() => {}, 1 << 30);
          JS
          # Same filename pattern prod uses (`*.config.cjs`). PR #111
          # broke because `ecosystem.runtime.cjs` doesn't match PM2's
          # config-file detection — it gets parsed as a process name.
          cat > ecosystem.runtime.config.cjs <<'CJS'
          module.exports = { apps: [
            { name: 'smoke-a', script: 'app.js' },
            { name: 'smoke-b', script: 'app.js' },
          ]};
          CJS
          # Two-step verb sequence matching ci.yml's deploy job:
          # 1. `pm2 reload <file>` for already-running apps (no-op when
          #    nothing is running, hence `|| true`)
          # 2. `pm2 start <file> --only <new-csv>` for apps not yet running
          # PR #110 broke when this used `pm2 startOrReload` which throws
          # on configs without a `deploy` block. Asserting the same shape
          # the deploy uses guarantees we won't reintroduce that pattern.
          pm2 reload ./ecosystem.runtime.config.cjs --update-env || true
          EXPECTED=$(node -e "console.log(require('/tmp/smoke/ecosystem.runtime.config.cjs').apps.map(a=>a.name).join('\n'))")
          RUNNING=$(sudo pm2 jlist 2>/dev/null | jq -r '.[].name' || pm2 jlist | jq -r '.[].name' || true)
          NEW=$(comm -23 <(echo "$EXPECTED" | sort) <(echo "$RUNNING" | sort) | paste -sd, -)
          if [ -n "$NEW" ]; then
            pm2 start ./ecosystem.runtime.config.cjs --only "$NEW" --update-env
          fi
          # Drift assertion (mirrors deploy's): every expected app is
          # online. If the verbs threw or the file wasn't parsed as an
          # ecosystem, this fails because zero apps came online.
          pm2 jlist | jq -e '[.[] | select(.pm2_env.status == "online")] | length == 2'
          pm2 delete all

  # Health-gated deploy with auto-rollback.
  #
  # Flow (all in one SSH script to keep it atomic):
  #   1. Snapshot the current VPS HEAD (BEFORE_SHA) — our rollback target.
  #   2. Fetch origin/main and diff for schema changes. Schema-touching
  #      files (src/db-migration*.ts, src/db.ts) require the manual
  #      `confirm_schema_change` input. Rollback CAN'T undo a migration
  #      safely, so we refuse to ship one by accident.
  #   3. git pull, write .deployed_sha (read by proxy.ts /health), npm
  #      ci --production, pm2 restart.
  #   4. Health-poll https://api.grove.md/health up to 12 × 5s = 60s.
  #      Success = HTTP 200 + JSON {ok: true, sha: TARGET_SHA}. The
  #      SHA match confirms we're seeing the new process, not a stale one.
  #   5. On health success → exit 0. GitHub Actions is the deploy log.
  #   6. On health failure → reset --hard BEFORE_SHA, reinstall, restart,
  #      re-poll rollback health. If that works, exit 1 with a clear
  #      rollback log. If the rollback also fails, exit 2 —
  #      api.grove.md is down and needs human attention.
  # Auto-runs on push to main once tests/audit/secrets pass. No staging
  # environment today, so green main == deployed. workflow_dispatch kept
  # for schema-touching deploys (requires confirm_schema_change=true) and
  # for manual re-runs.
  deploy:
    needs: [test, audit, secrets, pm2-deploy-smoke]
    # Serialize prod deploys across all runs. The workflow-level
    # concurrency above cancels in-progress runs on the same ref —
    # safe for PR pushes, dangerous mid-deploy (a fast follow-up
    # merge to main could SIGKILL pm2 reload). This per-job override
    # queues subsequent deploys instead of cancelling, so an in-flight
    # pm2 reload + health probe always completes.
    concurrency:
      group: grove-prod-deploy
      cancel-in-progress: false
    if: |
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Deploy with health gate + auto-rollback
        uses: appleboy/ssh-action@v1
        with:
          host: 52.37.76.231
          username: ubuntu
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: CONFIRM_SCHEMA_CHANGE,HEALTH_URL
          # /root/grove is root-owned, so re-enter as root via sudo. Env
          # vars passed by ssh-action must be preserved explicitly since
          # sudo strips env by default.
          script: |
            sudo --preserve-env=CONFIRM_SCHEMA_CHANGE,HEALTH_URL bash <<'DEPLOY_SCRIPT'
            set -eu
            cd /root/grove

            BEFORE_SHA=$(git rev-parse HEAD)
            echo "[deploy] before SHA: $BEFORE_SHA"

            git fetch --quiet origin main
            TARGET_SHA=$(git rev-parse origin/main)
            echo "[deploy] target SHA: $TARGET_SHA"

            if [ "$BEFORE_SHA" = "$TARGET_SHA" ]; then
              echo "[deploy] already up to date — nothing to do"
              exit 0
            fi

            # Schema-change guard. better-sqlite3 migrations can't be
            # rolled back code-only, so refuse unless the operator
            # ticked confirm_schema_change.
            SCHEMA_DIFF=$(git diff --name-only "$BEFORE_SHA" "$TARGET_SHA" -- 'src/db-migration*.ts' 'src/db.ts' 2>/dev/null || true)
            if [ -n "$SCHEMA_DIFF" ] && [ "${CONFIRM_SCHEMA_CHANGE:-false}" != "true" ]; then
              echo "::error::Schema change detected in: $SCHEMA_DIFF"
              echo "::error::Re-run workflow_dispatch with confirm_schema_change=true to proceed."
              exit 1
            fi
            if [ -n "$SCHEMA_DIFF" ]; then
              echo "[deploy] schema-change deploy acknowledged: $SCHEMA_DIFF"
            fi

            # Deploy.
            # Discard any local mods on the legacy ecosystem.config.cjs
            # (vault-provision.ts overwrote this in place pre-PR-#NN; the
            # file was removed from the repo in that PR). Without this
            # checkout, `git pull --ff-only` fails when the upstream
            # commit removes a locally-modified file. The 2>/dev/null
            # || true silently absorbs the case where the file is
            # already gone.
            git checkout -- ecosystem.config.cjs 2>/dev/null || true
            git pull --ff-only
            echo "$TARGET_SHA" > .deployed_sha
            # Full `npm ci` (NOT --production) so tsx + better-sqlite3 are
            # available — every grove process is invoked via `npx tsx` per
            # the generated ecosystem, and tsx lives in devDependencies.
            # The previous `--production` was inherited from a single-vault
            # past that compiled to JS up front; with multi-vault tsx-on-
            # demand it just breaks PM2 start-up.
            npm ci

            # Regenerate the runtime ecosystem from the vaults table,
            # then bring up PM2 against the new file. ecosystem.runtime.config.cjs
            # is gitignored (so `git reset --hard` rollback can't revert
            # it to a stale state) and is the single source of truth for
            # which procs PM2 manages. Failing loud here is intentional —
            # if the generator can't write the file, we'd otherwise spin
            # up whatever PM2 has cached, which is exactly how the
            # 2026-04-28 orphan grove-server crash-loop survived.
            sudo --preserve-env=GROVE_ECOSYSTEM_PATH npx tsx scripts/generate-ecosystem.ts
            if [ ! -f /root/grove/ecosystem.runtime.config.cjs ]; then
              echo "::error::ecosystem.runtime.config.cjs missing after generator ran"
              exit 1
            fi
            # Bring up the ecosystem in two passes:
            # 1. `pm2 reload` reloads any apps already running (zero-
            #    downtime in cluster mode, restart in fork mode).
            # 2. `pm2 start --only <new-csv>` starts any apps in the
            #    ecosystem that PM2 doesn't already know about (new
            #    vault provisioned since the last deploy).
            # `pm2 startOrReload` would do this in one verb, but the
            # version pinned on prod throws "Cannot read properties of
            # undefined (reading 'deploy')" — see vault-provision.ts
            # for the same two-step pattern at runtime provision time.
            sudo pm2 reload /root/grove/ecosystem.runtime.config.cjs --update-env
            EXPECTED=$(node -e "console.log(require('/root/grove/ecosystem.runtime.config.cjs').apps.map(a=>a.name).join('\n'))")
            RUNNING_NAMES=$(sudo pm2 jlist | jq -r '.[].name')
            NEW_APPS=$(comm -23 <(echo "$EXPECTED" | sort) <(echo "$RUNNING_NAMES" | sort) | tr '\n' ',' | sed 's/,$//')
            if [ -n "$NEW_APPS" ]; then
              echo "[deploy] starting new apps: $NEW_APPS"
              sudo pm2 start /root/grove/ecosystem.runtime.config.cjs --only "$NEW_APPS" --update-env
            fi

            # Drift reconcile: PM2's running set must equal the
            # generated ecosystem. Single source of truth in the repo
            # (PR-C) doesn't prevent state drift on the box — the
            # 2026-04-28 orphan grove-server was outside the generated
            # ecosystem and PM2 had no idea to remove it.
            #
            # Phase 1: prune orphans (PM2 apps not in the ecosystem).
            # The generator reads from the vaults table — anything PM2
            # is running that didn't come from that table is by
            # definition unmanaged and needs to go. This auto-heals
            # tonight's orphans (grove-server, grove-discovery) on the
            # first deploy that runs this code; subsequent deploys
            # are no-ops because there's nothing to prune.
            #
            # Phase 2: assert running == expected. If pruning didn't
            # converge (e.g. an app failed to start), fail loud so
            # the operator catches it before traffic shifts.
            EXPECTED=$(node -e "console.log(require('/root/grove/ecosystem.runtime.config.cjs').apps.map(a=>a.name).sort().join('\n'))")
            RUNNING=$(sudo pm2 jlist | jq -r '.[].name' | sort)
            ORPHANS=$(comm -23 <(echo "$RUNNING") <(echo "$EXPECTED"))
            if [ -n "$ORPHANS" ]; then
              echo "[deploy] pruning PM2 orphans:"
              echo "$ORPHANS" | sed 's/^/  /'
              for name in $ORPHANS; do
                sudo pm2 delete "$name" || echo "::warning::failed to delete $name"
              done
              sudo pm2 save
              RUNNING=$(sudo pm2 jlist | jq -r '.[].name' | sort)
            fi
            if [ "$EXPECTED" != "$RUNNING" ]; then
              echo "::error::PM2/ecosystem drift after prune"
              echo "expected:"; echo "$EXPECTED" | sed 's/^/  /'
              echo "running:"; echo "$RUNNING" | sed 's/^/  /'
              exit 1
            fi
            echo "[deploy] PM2 set matches ecosystem ($(echo "$EXPECTED" | wc -l | tr -d ' ') apps)"

            # Health poll — 12 × 5s = 60s window. We accept either the
            # full deep-health 200 OR a 503 whose body shows the new SHA
            # plus `"grove-server":true` — the latter happens when a
            # legacy vestigial sub-check (e.g. qmd on :8177) is down but
            # vault ops are fine. Per-vault `/v/<slug>/health` endpoints
            # remain the authoritative readiness probes for vault traffic.
            for i in $(seq 1 12); do
              sleep 5
              RESP=$(curl -sf "$HEALTH_URL" || curl -s "$HEALTH_URL" || echo "")
              if echo "$RESP" | grep -q "\"sha\":\"$TARGET_SHA\""; then
                if echo "$RESP" | grep -q "\"ok\":true"; then
                  echo "[deploy] healthy on attempt $i"
                  exit 0
                fi
                if echo "$RESP" | grep -q '"grove-server":true'; then
                  echo "[deploy] degraded-but-ok on attempt $i (sha matches, grove-server up): $RESP"
                  exit 0
                fi
              fi
              echo "[deploy] attempt $i: $RESP"
            done

            # Health failed — roll back.
            echo "::error::health-check failed after 60s; rolling back to $BEFORE_SHA"
            git reset --hard "$BEFORE_SHA"
            echo "$BEFORE_SHA" > .deployed_sha
            npm ci
            # Regenerate the runtime ecosystem against the rolled-back
            # code. Same fail-loud contract as the forward path.
            sudo --preserve-env=GROVE_ECOSYSTEM_PATH npx tsx scripts/generate-ecosystem.ts
            if [ ! -f /root/grove/ecosystem.runtime.config.cjs ]; then
              echo "::error::ecosystem.runtime.config.cjs missing after rollback regen"
              exit 2
            fi
            sudo pm2 reload /root/grove/ecosystem.runtime.config.cjs --update-env

            # Verify rollback health.
            for i in $(seq 1 6); do
              sleep 5
              if curl -sf "$HEALTH_URL" | grep -q "\"ok\":true"; then
                echo "::error::deploy failed; rolled back to $BEFORE_SHA successfully"
                exit 1
              fi
            done

            echo "::error::ROLLBACK ALSO FAILED — api.grove.md is down; manual intervention required"
            exit 2
            DEPLOY_SCRIPT
        env:
          CONFIRM_SCHEMA_CHANGE: ${{ github.event.inputs.confirm_schema_change || 'false' }}
          HEALTH_URL: https://api.grove.md/health

  # Post-deploy prod smoke. Runs AFTER deploy succeeds; gates nothing
  # (prod is already live by the time this runs). Catches regressions
  # the deploy health-check can't — specifically, URL-slug / vault-
  # isolation bugs like PR #66, which are invisible to /health but
  # corrupt every URL the API emits. Fails the run if the slug check
  # fails so the merge commit shows red, which pages via the usual
  # CI notification path.
  #
  # Needs a bearer token scoped to the test-vault; set
  # `GROVE_SMOKE_TOKEN` in repo secrets. If unset the job is a no-op
  # so the first merge after this lands doesn't go red.
  smoke-prod:
    needs: deploy
    if: |
      success() &&
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Vault-slug invariant against prod
        env:
          TOKEN: ${{ secrets.GROVE_SMOKE_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN:-}" ]; then
            echo "::warning::GROVE_SMOKE_TOKEN not set — skipping post-deploy smoke. Add the secret to enable."
            exit 0
          fi
          # Write a dated smoke note to test-vault. PUT response includes
          # { url, ... }. The URL must start with /@jm/test-vault/ — any
          # other slug means a per-vault process is minting URLs against
          # the wrong env (regression of PR #66: GROVE_VAULT_SLUG unset,
          # silent fallback to "personal"). Read-only endpoints don't
          # reliably include the url field today, so we use write — the
          # cost is one cheap Inbox note per deploy, path is dated so
          # writes don't collide.
          DATE=$(date -u +%Y%m%dT%H%M%S)
          RESP=$(curl -sfS -X PUT \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            -d "{\"frontmatter\":{\"type\":\"note\",\"tags\":[\"smoke\"],\"aliases\":[\"Smoke $DATE\"]},\"content\":\"Post-deploy smoke. sha=${GITHUB_SHA}\"}" \
            "https://api.grove.md/v/test-vault/v1/notes/Inbox%2Fsmoke-${DATE}.md")
          if ! echo "$RESP" | grep -q '"url":"https://grove.md/@jm/test-vault/'; then
            echo "::error::vault-slug invariant violated — test-vault write URL is not /@jm/test-vault/"
            echo "response: $RESP" | head -c 400
            exit 1
          fi
          echo "[smoke] test-vault write URL slug ok: $(echo "$RESP" | grep -oE '"url":"[^"]+"')"
